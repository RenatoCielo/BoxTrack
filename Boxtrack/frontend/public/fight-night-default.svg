  <text x="72" y="220" fill="#fff" font-family="Georgia,serif" font-size="68">La próxima campana</text>
  <text x="72" y="300" fill="#fff" font-family="Georgia,serif" font-size="68">suena entre gimnasios.</text>
  <text x="76" y="370" fill="#fff" fill-opacity=".72" font-family="Arial,sans-serif" font-size="22" letter-spacing="3">ENCUENTROS · RESPETO · BOXEO</text>
